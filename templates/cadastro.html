<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Jogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%);
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .back-link {
            display: inline-block;
            color: #7c3aed;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            color: #1e1b4b;
            font-size: 24px;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #6b7280;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.45);
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="back-link">← Voltar</a>
        <h1>🎮 Cadastrar Jogo</h1>
        <p class="subtitle">Preencha as informações do jogo abaixo</p>

        <form action="/Pcadastro" method="post">
            <div class="field">
                <label for="nome">Nome do jogo</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: The Legend of Zelda" required>
            </div>

            <div class="field">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Uma breve descrição do jogo" required>
            </div>

            <div class="field">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria" placeholder="Ex: RPG, Ação, Aventura" required>
            </div>

            <div class="field">
                <label for="ano">Ano de lançamento</label>
                <input type="number" id="ano" name="ano" min="1950" max="2026" placeholder="Ex: 2024" required>
            </div>

            <button type="submit">Cadastrar jogo</button>
        </form>
    </div>
</body>
</html>
