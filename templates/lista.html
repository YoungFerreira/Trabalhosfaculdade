<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Jogos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%);
            padding: 40px 20px;
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .back-link {
            color: #ede9fe;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .add-link {
            background: #ffffff;
            color: #4c1d95;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        .add-link:hover {
            background: #f5f3ff;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #ddd6fe;
            margin-bottom: 28px;
            font-size: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .game-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
        }

        .game-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 8px;
        }

        .game-desc {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 999px;
        }

        .tag-categoria {
            background: #ede9fe;
            color: #5b21b6;
        }

        .tag-ano {
            background: #fef3c7;
            color: #92400e;
        }

        .empty-state {
            background: #ffffff;
            border-radius: 14px;
            padding: 48px 24px;
            text-align: center;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-bar">
            <a href="/" class="back-link">← Voltar ao início</a>
            <a href="/cadastro" class="add-link">➕ Novo jogo</a>
        </div>

        <h1>📋 Catálogo de Jogos</h1>
        <p class="subtitle">Todos os jogos cadastrados</p>

        {% if jogos %}
        <div class="grid">
            {% for jogo in jogos %}
            <div class="game-card">
                <div class="game-name">{{ jogo.nome }}</div>
                <div class="game-desc">{{ jogo.descricao }}</div>
                <div class="tags">
                    <span class="tag tag-categoria">{{ jogo.categoria }}</span>
                    <span class="tag tag-ano">{{ jogo.ano }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state">
            <div class="icon">🕹️</div>
            <p>Nenhum jogo cadastrado ainda.</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
